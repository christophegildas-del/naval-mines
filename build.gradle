buildscript {
  repositories {
    mavenCentral()
    gradlePluginPortal()
  }
  ext {
    appName = 'naval_mines'
    gdxVersion = '1.12.1'
  }
}

allprojects {
  apply plugin: 'eclipse'
  apply plugin: 'idea'

  repositories {
    mavenCentral()
  }

  // Règle de compatibilité JVM pour débloquer le variant matching du plugin TeaVM
  dependencies {
    attributesSchema {
      attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE) {
        compatibilityRules.add(TargetJvmVersionCompatibilityRule)
      }
    }
  }
}

configure(subprojects) {
  apply plugin: 'java-library'

  java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
  }
}

class TargetJvmVersionCompatibilityRule implements AttributeCompatibilityRule<Integer> {
  @Override
  void execute(CompatibilityCheckDetails<Integer> details) {
    details.compatible()
  }
}

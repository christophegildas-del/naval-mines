buildscript {
  repositories {
    mavenCentral()
    gradlePluginPortal()
  }
  ext {
    gdxVersion = '1.12.1'
  }
}

allprojects {
  apply plugin: 'eclipse'
  apply plugin: 'idea'

  repositories {
    mavenCentral()
  }

  // Méthode 1 : Règle de compatibilité JVM pour débloquer le variant matching du plugin TeaVM
  dependencies {
    attributesSchema {
      attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE) {
        compatibilityRules.add(TargetJvmVersionCompatibilityRule)
      }
    }
  }
}

// Méthode 2 : Alignement global du bytecode sur Java 11 pour tous les sous-modules
configure(subprojects) {
  apply plugin: 'java-library'

  java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
  }
}

// Implémentation de la règle de compatibilité d'attributs (Méthode 1)
class TargetJvmVersionCompatibilityRule implements AttributeCompatibilityRule<Integer> {
  @Override
  void execute(CompatibilityCheckDetails<Integer> details) {
    // Déclare les versions JVM demandées et fournies comme toujours compatibles
    details.compatible()
  }
}

plugins {
  id 'java'
  id 'org.wisepersist.gwt' version '1.1.18'
  id 'org.gretty' version '3.1.0'
}

java {
  sourceCompatibility = JavaVersion.VERSION_11
  targetCompatibility = JavaVersion.VERSION_11
}

repositories {
  mavenCentral()
}

dependencies {
  implementation project(':core')
  implementation "com.badlogicgames.gdx:gdx:$gdxVersion:sources"
  implementation "com.badlogicgames.gdx:gdx-backend-gwt:$gdxVersion"
  implementation "com.badlogicgames.gdx:gdx-backend-gwt:$gdxVersion:sources"
}

// Correction des avertissements 'gwt' et 'modules' via le bloc d'extension explicite
gwt {
  gwtVersion = '2.9.0'
  maxHeapSize = '1024m'
  minHeapSize = '256m'
  modules = ['io.github.naval_mines.GwtDefinition']
}

// Correction de 'task is deprecated', 'buildDir is deprecated' et 'dependsOn'
tasks.register('dist', Copy) {
  dependsOn tasks.named('compileGwt')
  from layout.buildDirectory.dir("gwt/out")
  into layout.buildDirectory.dir("dist")

  // Inclure la page d'accueil statique
  from 'src/main/webapp'
}

tasks.named('build') {
  dependsOn tasks.named('dist')
}

sourceSets {
  main {
    // Ajoute les sources du core pour le compilateur GWT
    java.srcDirs += project(':core').sourceSets.main.java.srcDirs
    // GWT considère les .java et .gwt.xml comme des ressources à parser
    resources.srcDirs += project(':core').sourceSets.main.java.srcDirs
  }
}

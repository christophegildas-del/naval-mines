plugins {
  id 'java'
  id 'org.teavm' version '0.9.2'
}

java {
  sourceCompatibility = JavaVersion.VERSION_17
  targetCompatibility = JavaVersion.VERSION_17
}

repositories {
  mavenCentral()
  maven { url 'https://jitpack.io' }
}

dependencies {
  implementation project(':core')
  // Utilisation du tag / commit valide sur JitPack pour gdx-teavm
  implementation 'com.github.mgsx-dev:gdx-teavm:master-SNAPSHOT'
}

teavm {
  js {
    mainClass = 'com.naval_mines.teavm.TeaVMLauncher'
    outputDir = layout.buildDirectory.dir("dist/webapp").get().asFile
  }
}

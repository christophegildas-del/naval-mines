plugins {
  id 'java'
  id 'org.teavm' version '0.9.2'
}

java {
  sourceCompatibility = JavaVersion.VERSION_17
  targetCompatibility = JavaVersion.VERSION_17
}

repositories {
  mavenCentral()
  maven { url 'https://jitpack.io' }
}

dependencies {
  implementation project(':core')
  // Utilisation de la dépendance officielle xoppa/gdx-teavm sur JitPack
  implementation 'com.github.xoppa:gdx-teavm:master-SNAPSHOT'
}

teavm {
  js {
    mainClass = 'com.monjeu.naval_mines.teavm.TeaVMLauncher' // Remplace avec ton package exact
    outputDir = layout.buildDirectory.dir("dist/webapp").get().asFile
  }
}

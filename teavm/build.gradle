plugins {
  id 'java'
  id 'org.teavm' version '0.9.2'
}

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(17)
  }
  sourceCompatibility = JavaVersion.VERSION_17
  targetCompatibility = JavaVersion.VERSION_17
}

// Forcer Gradle à accepter Java 17 pour la résolution du projet :core
configurations.all {
  attributes {
    attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 17)
  }
}

repositories {
  mavenCentral()
}

dependencies {
  implementation project(':core')
  implementation 'com.github.xpenatan.gdx-teavm:backend-teavm:1.0.0'
  implementation "com.badlogicgames.gdx:gdx:$gdxVersion"
}

teavm {
  js {
    mainClass = 'com.naval_mines.teavm.TeaVMLauncher'
    outputDir = layout.buildDirectory.dir("teavm/web").get().asFile
  }
}

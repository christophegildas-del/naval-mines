plugins {
  id 'java'
  id 'org.teavm' version '0.9.2'
}

dependencies {
  implementation project(':core')
  implementation "com.github.mgsx-dev.gdx-teavm:gdx-teavm:1.0.0"
}

teavm {
  js {
    mainClass = 'com.monjeu.teavm.TeaVMLauncher' // Adaptez selon votre package exact
    // Utilisation de layout.buildDirectory au lieu de $buildDir déprécié
    outputDir = layout.buildDirectory.dir("dist/webapp").get().asFile
  }
}


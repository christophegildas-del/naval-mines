plugins {
  id 'java'
  id 'org.teavm' version '0.9.1'
}

java {
  sourceCompatibility = JavaVersion.VERSION_11
  targetCompatibility = JavaVersion.VERSION_11
}

// 1. Verrouillage strict de toutes les sous-dépendances TeaVM sur la version 0.9.1
allprojects {
  configurations.all {
    resolutionStrategy {
      force 'org.teavm:teavm-core:0.9.1',
        'org.teavm:teavm-classlib:0.9.1',
        'org.teavm:teavm-jso:0.9.1',
        'org.teavm:teavm-jso-apis:0.9.1',
        'org.teavm:teavm-tooling:0.9.1'

      eachDependency { details ->
        if (details.requested.group == 'org.teavm') {
          details.useVersion '0.9.1'
        }
      }
    }
  }
}

// 2. Alignement des attributs JVM pour la résolution du projet :core
configurations.configureEach {
  if (canBeResolved || canBeConsumed) {
    attributes {
      attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 11)
    }
  }
}

repositories {
  mavenCentral()
}

dependencies {
  implementation project(':core')
  implementation 'com.github.xpenatan.gdx-teavm:backend-teavm:1.0.0'
  implementation "com.badlogicgames.gdx:gdx:$gdxVersion"
}

teavm {
  js {
    mainClass = 'com.naval_mines.teavm.TeaVMLauncher'
    outputDir = file("${buildDir}/teavm/web")
  }
}

afterEvaluate {
  tasks.named('build').configure {
    dependsOn tasks.matching { it.name.toLowerCase().contains('teavm') || it.name.toLowerCase().contains('javascript') }
  }
}

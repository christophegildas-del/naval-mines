plugins {
  id 'java'
  id 'org.teavm' version '0.9.2'
}

java {
  sourceCompatibility = JavaVersion.VERSION_17
  targetCompatibility = JavaVersion.VERSION_17
}

repositories {
  mavenCentral()
}

dependencies {
  implementation project(':core')

  // Dépendances TeaVM officielles publiées sur Maven Central
  implementation 'org.teavm:teavm-classlib:0.9.2'
  implementation 'org.teavm:teavm-jso:0.9.2'
  implementation 'org.teavm:teavm-jso-apis:0.9.2'

  // Core LibGDX
  implementation "com.badlogicgames.gdx:gdx:$gdxVersion"
}

teavm {
  js {
    mainClass = 'com.monjeu.naval_mines.teavm.TeaVMLauncher' // Remplace par ton package exact
    outputDir = layout.buildDirectory.dir("dist/webapp").get().asFile
  }
}

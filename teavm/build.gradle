plugins {
  id 'java'
  id 'org.teavm' version '0.9.2'
}

java {
  sourceCompatibility = JavaVersion.VERSION_17
  targetCompatibility = JavaVersion.VERSION_17
}

repositories {
  mavenCentral()
}

dependencies {
  implementation project(':core')

  // Backend TeaVM officiel pour LibGDX (sur Maven Central)
  implementation 'com.github.xpenatan.gdx-teavm:backend-teavm:1.0.0-b8'

  // Core LibGDX
  implementation "com.badlogicgames.gdx:gdx:$gdxVersion"
}

teavm {
  js {
    mainClass = 'com.naval_mines.teavm.TeaVMLauncher'
    outputDir = layout.buildDirectory.dir("dist/webapp").get().asFile
  }
}

plugins {
  id 'java'
  id 'org.teavm' version '0.9.2'
}

java {
  sourceCompatibility = JavaVersion.VERSION_17
  targetCompatibility = JavaVersion.VERSION_17
}

repositories {
  mavenCentral()
}

dependencies {
  implementation project(':core')
  implementation 'com.github.xpenatan.gdx-teavm:backend-teavm:1.0.0'
  implementation "com.badlogicgames.gdx:gdx:$gdxVersion"
}

teavm {
  js {
    mainClass = 'com.naval_mines.teavm.TeaVMLauncher'
    // Forcer le dossier de sortie dans build/dist
    outputDir = file("${buildDir}/dist")
  }
}

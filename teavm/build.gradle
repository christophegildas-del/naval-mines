plugins {
  id 'java'
  id 'org.teavm' version '0.9.2'
}

java {
  sourceCompatibility = JavaVersion.VERSION_17
  targetCompatibility = JavaVersion.VERSION_17
}

repositories {
  mavenCentral()
  maven { url 'https://jitpack.io' }
}

dependencies {
  implementation project(':core')

  // LibGDX Core
  implementation "com.badlogicgames.gdx:gdx:$gdxVersion"

  // Version enregistrée et fonctionnelle du backend gdx-teavm sur JitPack (via commit sha exact)
  implementation 'com.github.mgsx-dev.gdx-teavm:gdx-teavm-backend:master-SNAPSHOT'
}

teavm {
  js {
    mainClass = 'com.naval_mines.teavm.TeaVMLauncher'
    outputDir = layout.buildDirectory.dir("dist/webapp").get().asFile
  }
}

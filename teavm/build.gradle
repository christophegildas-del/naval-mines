plugins {
  id 'java'
  id 'org.teavm' version '0.9.2'
}

java {
  sourceCompatibility = JavaVersion.VERSION_17
  targetCompatibility = JavaVersion.VERSION_17
}

repositories {
  mavenCentral()
  maven { url 'https://jitpack.io' }
}

dependencies {
  implementation project(':core')
  // Utilisation d'un commit hash / release valide sur JitPack
  implementation 'com.github.mgsx-dev:gdx-teavm:1.0.0-b1'
}

teavm {
  js {
    mainClass = 'com.naval_mines.teavm.TeaVMLauncher'
    outputDir = layout.buildDirectory.dir("dist/webapp").get().asFile
  }
}

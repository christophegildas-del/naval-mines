plugins {
  id 'java'
  id 'org.teavm' version '0.9.2'
}

java {
  sourceCompatibility = JavaVersion.VERSION_11
  targetCompatibility = JavaVersion.VERSION_11
}

// Application des attributs JVM uniquement sur les configurations autorisées
configurations.configureEach {
  if (canBeResolved || canBeConsumed) {
    attributes {
      attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 11)
    }
  }
}

repositories {
  mavenCentral()
}

dependencies {
  implementation project(':core')
  implementation 'com.github.xpenatan.gdx-teavm:backend-teavm:1.0.0'
  implementation "com.badlogicgames.gdx:gdx:$gdxVersion"
}

teavm {
  js {
    mainClass = 'com.naval_mines.teavm.TeaVMLauncher'
    outputDir = file("${buildDir}/teavm/web")
  }
}

// Forcer Gradle à exécuter la transpilation TeaVM lors de l'exécution de ./gradlew :teavm:build
afterEvaluate {
  tasks.named('build').configure {
    dependsOn tasks.matching { it.name.toLowerCase().contains('teavm') || it.name.toLowerCase().contains('javascript') }
  }
}
